services:
  interview-report-service:
    image:  srijanray/interview-report-service:1.0.0
    container_name: interview-report-service
    env_file: 
      - ./.env
    networks:
      - interviewmate-network

    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      interval: 10s
      retries: 10
      start_period: 40s

networks:
  interviewmate-network:
    external: true
